name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Debug

jobs:
  build-core:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf
        run: choco install protoc --version 25.3 -y

      - name: Configure CMake
        run: cmake -S rex-core -B rex-core/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        run: cmake --build rex-core/build --config ${{env.BUILD_TYPE}}

      - name: Run Core Tests
        run: ctest --test-dir rex-core/build --output-on-failure
        if: ${{ !cancelled() }}

  build-shell:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore rex-shell/REX.sln

      - name: Build
        run: dotnet build rex-shell/REX.sln --configuration ${{env.BUILD_TYPE}} --no-restore

      - name: Run Shell Tests
        run: dotnet test rex-shell/REX.sln --configuration ${{env.BUILD_TYPE}} --no-build --verbosity normal
        if: ${{ !cancelled() }}
